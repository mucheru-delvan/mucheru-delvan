<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="985px"
    height="610px"
    font-family="ConsolasFallback, Consolas, monospace"
    font-size="16px"
>

  <style>

    @font-face {
      font-family: ConsolasFallback;
      src: local("DejaVu Sans Mono");
    }

    text,
    tspan {
      white-space: pre;
    }

    .ascii {
      font-family: ConsolasFallback, Consolas, monospace;
      font-size: 10px;
      fill: #24292f;
    }

    .terminal {
      font-family: ConsolasFallback, Consolas, monospace;
      font-size: 13px;
      fill: #24292f;
    }

    .key {
      fill: #0550ae;
    }

    .value {
      fill: #0969da;
    }

    .cc {
      fill: #57606a;
    }

  </style>


