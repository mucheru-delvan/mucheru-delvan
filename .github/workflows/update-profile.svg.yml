name: Update Profile SVGs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two updates at once (e.g. a manual run during the schedule).
concurrency:
  group: update-profile-svgs
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dateutil requests

      - name: Update SVG statistics
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: mucheru-delvan
        run: python today.py

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add light_mode.svg dark_mode.svg

          if git diff --cached --quiet; then
            echo "No SVG changes to commit."
          else
            git commit -m "chore: update profile statistics"
            git pull --rebase
            git push
          fi